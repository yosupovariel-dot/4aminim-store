<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="איור של סט ארבעת המינים">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf5ec"/>
      <stop offset="100%" stop-color="#cfe8d4"/>
    </linearGradient>
    <linearGradient id="lulav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fb582"/>
      <stop offset="100%" stop-color="#4f8f56"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#bg)"/>
  <g transform="translate(240,190)">
    <!-- lulav leaves -->
    <path d="M0,-150 C 10,-90 10,-30 0,20 C -10,-30 -10,-90 0,-150 Z" fill="url(#lulav)"/>
    <path d="M-22,-135 C -10,-85 -8,-30 -14,15 C -28,-30 -30,-85 -22,-135 Z" fill="url(#lulav)" opacity="0.9" transform="rotate(-8)"/>
    <path d="M22,-135 C 10,-85 8,-30 14,15 C 28,-30 30,-85 22,-135 Z" fill="url(#lulav)" opacity="0.9" transform="rotate(8)"/>
    <!-- hadas / arava leaves cluster -->
    <ellipse cx="-55" cy="30" rx="26" ry="46" fill="#6fae74" transform="rotate(-18 -55 30)"/>
    <ellipse cx="55" cy="30" rx="26" ry="46" fill="#6fae74" transform="rotate(18 55 30)"/>
    <!-- etrog -->
    <ellipse cx="0" cy="90" rx="34" ry="44" fill="#f4d35e"/>
    <ellipse cx="0" cy="90" rx="34" ry="44" fill="none" stroke="#e0b93f" stroke-width="2"/>
    <path d="M0,46 C 4,38 10,36 14,40" fill="none" stroke="#8a6d1f" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="240" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#3f6b45">כל סט מגיע עם אתרוג שנבחר עבורכם</text>
</svg>
